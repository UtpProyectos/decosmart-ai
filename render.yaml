# Render Blueprint — DECOSMART AI
# Base de datos: Neon (externa, DATABASE_URL con sslmode=require). No se usa Postgres de Render.
# Deploys: autoDeploy=false; los dispara .github/workflows/deploy.yml (deploy hooks) tras CI verde en main.
services:
  - type: web
    name: decosmart-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_MODE
        value: mock # cambiar a live manualmente cuando OPENAI_API_KEY esté cargada
      - key: TELEGRAM_MODE
        value: webhook
      - key: STORAGE_BACKEND
        value: s3
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_TELEGRAM_CHAT_ID
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: decosmart-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_TELEGRAM_BOT_URL
        sync: false

  - type: web
    name: decosmart-dashboard
    runtime: docker
    rootDir: dashboard
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: false
    envVars:
      - key: DASHBOARD_API_URL
        sync: false
      - key: DASHBOARD_ADMIN_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
